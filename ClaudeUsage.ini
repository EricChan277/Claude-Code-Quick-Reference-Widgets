[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Claude Usage
Author=Eric Chan
Information=Live Claude Code usage: current session (5h) + weekly all-models limits with reset countdowns, context window, and a collapsible, category-grouped list of installed agents. All data comes from ~/.claude/statusline.ps1 (no remote API calls).
Version=3.0

[Variables]
DataFile=#@#usage.txt
AgentsFile=#@#agents.txt
PanelW=440
BarW=408
AgentsOpen=1
ExpandH=696
CollapseH=242
SearchQuery=
FontName=Segoe UI
cText=235,237,240,255
cDim=140,146,158,255
cAgent=176,182,194,255
cAccent=214,140,70,255
cTrack=255,255,255,26
cChipBg=255,255,255,12
cChipBorder=255,255,255,28

; ---------------------------------------------------------------- measures
[MeasureData]
Measure=Script
ScriptFile=#@#usage.lua
UpdateDivider=1

; Editable search field (overlaid only while typing). On Enter it stores the
; query in #SearchQuery# and asks the Lua engine to re-filter the agents list.
[MeasureSearch]
Measure=Plugin
Plugin=InputText
X=240
Y=216
W=158
H=18
FontFace=#FontName#
FontSize=9
FontColor=#cText#
SolidColor=30,32,40,255
StringStyle=Normal
FocusDismiss=1
InputLimit=40
DefaultValue=#SearchQuery#
Command1=[!SetVariable SearchQuery "$UserInput$"][!CommandMeasure MeasureData "ApplySearch()"]

; ---------------------------------------------------------------- panel bg
[MeterBackground]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 0,0,#PanelW#,(#AgentsOpen# * #ExpandH# + (1 - #AgentsOpen#) * #CollapseH#),12 | Fill Color 18,20,26,235 | StrokeWidth 1 | Stroke Color 255,255,255,18
[MeterAccent]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,4,2 | Fill Color #cAccent# | StrokeWidth 0

; ---------------------------------------------------------------- header
[MeterTitle]
Meter=String
X=16
Y=12
FontFace=#FontName#
FontSize=12
FontColor=#cText#
StringStyle=Bold
AntiAlias=1
Text=CLAUDE USAGE

[MeterModel]
Meter=String
X=424
Y=14
FontFace=#FontName#
FontSize=9
FontColor=#cAccent#
StringAlign=Right
AntiAlias=1
DynamicVariables=1
Text=[&MeasureData:GetStr('MODEL')]

[MeterLimitsAge]
Meter=String
X=424
Y=33
FontFace=#FontName#
FontSize=8
FontColor=#cDim#
StringAlign=Right
AntiAlias=1
DynamicVariables=1
Text=[&MeasureData:GetStr('LIMITS_AGE')]

; ================================================================ LIMITS
; --- Current session (5h) ---
[MeterSessionLabel]
Meter=String
X=16
Y=56
FontFace=#FontName#
FontSize=10
FontColor=#cText#
AntiAlias=1
Text=Current session
[MeterSessionPct]
Meter=String
X=424
Y=56
FontFace=#FontName#
FontSize=10
FontColor=#cText#
StringAlign=Right
StringStyle=Bold
AntiAlias=1
DynamicVariables=1
Text=[&MeasureData:GetPct('SESSION_PCT')]
[MeterSessionTrack]
Meter=Image
X=16
Y=74
W=#BarW#
H=8
SolidColor=#cTrack#
[MeterSessionFill]
Meter=Image
X=16
Y=74
H=8
W=[&MeasureData:BarW('SESSION',#BarW#)]
SolidColor=[&MeasureData:GetStr('SESSION_COLOR')]
DynamicVariables=1
[MeterSessionReset]
Meter=String
X=16
Y=85
FontFace=#FontName#
FontSize=8
FontColor=#cDim#
AntiAlias=1
DynamicVariables=1
Text=resets in [&MeasureData:GetStr('SESSION_CD')] ([&MeasureData:GetStr('SESSION_AT')])

; --- Weekly - All models ---
[MeterWeekAllLabel]
Meter=String
X=16
Y=104
FontFace=#FontName#
FontSize=10
FontColor=#cText#
AntiAlias=1
Text=Weekly - All models
[MeterWeekAllPct]
Meter=String
X=424
Y=104
FontFace=#FontName#
FontSize=10
FontColor=#cText#
StringAlign=Right
StringStyle=Bold
AntiAlias=1
DynamicVariables=1
Text=[&MeasureData:GetPct('WEEK_ALL_PCT')]
[MeterWeekAllTrack]
Meter=Image
X=16
Y=122
W=#BarW#
H=8
SolidColor=#cTrack#
[MeterWeekAllFill]
Meter=Image
X=16
Y=122
H=8
W=[&MeasureData:BarW('WEEK_ALL',#BarW#)]
SolidColor=[&MeasureData:GetStr('WEEK_ALL_COLOR')]
DynamicVariables=1
[MeterWeekAllReset]
Meter=String
X=16
Y=133
FontFace=#FontName#
FontSize=8
FontColor=#cDim#
AntiAlias=1
DynamicVariables=1
Text=resets in [&MeasureData:GetStr('WEEK_ALL_CD')] ([&MeasureData:GetStr('WEEK_ALL_AT')])

; --- Context window ---
[MeterCtxLabel]
Meter=String
X=16
Y=152
FontFace=#FontName#
FontSize=10
FontColor=#cText#
AntiAlias=1
Text=Context window
[MeterCtxPct]
Meter=String
X=424
Y=152
FontFace=#FontName#
FontSize=10
FontColor=#cText#
StringAlign=Right
StringStyle=Bold
AntiAlias=1
DynamicVariables=1
Text=[&MeasureData:GetPct('CTX_PCT')]
[MeterCtxTrack]
Meter=Image
X=16
Y=170
W=#BarW#
H=8
SolidColor=#cTrack#
[MeterCtxFill]
Meter=Image
X=16
Y=170
H=8
W=[&MeasureData:BarW('CTX',#BarW#)]
SolidColor=[&MeasureData:GetStr('CTX_COLOR')]
DynamicVariables=1
[MeterCtxTokens]
Meter=String
X=16
Y=181
FontFace=#FontName#
FontSize=8
FontColor=#cDim#
AntiAlias=1
DynamicVariables=1
Text=[&MeasureData:GetStr('CTX_LABEL')] tokens

; ================================================================ AGENTS
[MeterDivider]
Meter=Image
X=16
Y=208
W=#BarW#
H=1
SolidColor=255,255,255,20

; Chevron: Consolas + left align — 3 monospace glyphs, both edges fixed at X=16.
[MeterAgentsChevronOpen]
Meter=String
Group=AgentsToggle
X=16
Y=218
FontFace=Consolas
FontSize=10
FontColor=#cAccent#
StringStyle=Bold
AntiAlias=1
StringAlign=Left
DynamicVariables=1
Hidden=(1-#AgentsOpen#)
Text=[-]
LeftMouseUpAction=[!CommandMeasure MeasureData "ToggleAgents()"]
ToolTipText=Click to collapse / expand

[MeterAgentsChevronClosed]
Meter=String
Group=AgentsToggle
X=16
Y=218
FontFace=Consolas
FontSize=10
FontColor=#cAccent#
StringStyle=Bold
AntiAlias=1
StringAlign=Left
DynamicVariables=1
Hidden=#AgentsOpen#
Text=[+]
LeftMouseUpAction=[!CommandMeasure MeasureData "ToggleAgents()"]
ToolTipText=Click to collapse / expand

[MeterAgentsHeader]
Meter=String
Group=AgentsToggle
X=40
Y=218
W=184
FontFace=#FontName#
FontSize=10
FontColor=#cAccent#
StringStyle=Bold
AntiAlias=1
StringAlign=Left
ClipString=1
DynamicVariables=1
Text=INSTALLED AGENTS ([&MeasureData:GetStr('AGENTS_COUNT')])
LeftMouseUpAction=[!CommandMeasure MeasureData "ToggleAgents()"]
ToolTipText=Click to collapse / expand

; ---- search field (chip + placeholder/query text + clear button) ----
[MeterSearchBg]
Meter=Shape
Group=Agents
DynamicVariables=1
Hidden=(1 - #AgentsOpen#)
Shape=Rectangle 232,214,192,22,6 | Fill Color #cChipBg# | StrokeWidth 1 | Stroke Color #cChipBorder#
LeftMouseUpAction=[!CommandMeasure MeasureSearch "ExecuteBatch 1"]
ToolTipText=Click to search agents

[MeterSearchPrompt]
Meter=String
Group=Agents
X=240
Y=216
W=172
FontFace=#FontName#
FontSize=9
FontColor=#cDim#
AntiAlias=1
ClipString=1
DynamicVariables=1
Hidden=[&MeasureData:PlaceholderHidden()]
Text=search agents...
LeftMouseUpAction=[!CommandMeasure MeasureSearch "ExecuteBatch 1"]
ToolTipText=Click to search agents

[MeterSearchText]
Meter=String
Group=Agents
X=240
Y=216
W=162
FontFace=#FontName#
FontSize=9
FontColor=#cText#
AntiAlias=1
ClipString=1
DynamicVariables=1
Hidden=[&MeasureData:SearchTextHidden()]
Text=[&MeasureData:SearchText()]
LeftMouseUpAction=[!CommandMeasure MeasureSearch "ExecuteBatch 1"]
ToolTipText=Click to edit search

[MeterSearchClear]
Meter=String
Group=Agents
X=414
Y=214
FontFace=#FontName#
FontSize=11
FontColor=#cDim#
StringAlign=Center
StringStyle=Bold
AntiAlias=1
DynamicVariables=1
Hidden=[&MeasureData:ClearHidden()]
Text=x
LeftMouseUpAction=[!SetVariable SearchQuery ""][!CommandMeasure MeasureData "ApplySearch()"]
ToolTipText=Clear search

[MeterAgentsLeft]
Meter=String
Group=Agents
X=16
Y=240
W=205
FontFace=#FontName#
FontSize=8
FontColor=#cAgent#
AntiAlias=1
ClipString=0
DynamicVariables=1
Hidden=(1 - #AgentsOpen#)
InlineSetting=Bold
InlinePattern=(?m)^\S.*$
InlineSetting2=Color,#cAccent#
InlinePattern2=(?m)^\S.*$
Text=[&MeasureData:GetStr('AGENTS_L')]

[MeterAgentsRight]
Meter=String
Group=Agents
X=232
Y=240
W=205
FontFace=#FontName#
FontSize=8
FontColor=#cAgent#
AntiAlias=1
ClipString=0
DynamicVariables=1
Hidden=(1 - #AgentsOpen#)
InlineSetting=Bold
InlinePattern=(?m)^\S.*$
InlineSetting2=Color,#cAccent#
InlinePattern2=(?m)^\S.*$
Text=[&MeasureData:GetStr('AGENTS_R')]
